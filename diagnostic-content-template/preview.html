<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断コンテンツ プレビュー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }

    /* --- Header --- */
    .preview-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      text-align: center;
      padding: 48px 20px 36px;
    }
    .preview-header h1 {
      font-size: 1.7rem;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .preview-header p {
      font-size: 0.95rem;
      opacity: 0.8;
    }

    /* --- Tab navigation --- */
    .tab-nav {
      display: flex;
      justify-content: center;
      gap: 0;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 16px 24px;
      border: none;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: #4f46e5;
    }
    .tab-btn.active {
      color: #4f46e5;
      border-bottom-color: #4f46e5;
    }

    /* --- Tab content --- */
    .tab-panel {
      display: none;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .tab-panel.active {
      display: block;
    }

    /* --- Card wrapper for diagnosis --- */
    .preview-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      overflow: hidden;
      margin-bottom: 32px;
    }

    /* --- Section label --- */
    .section-label {
      font-size: 0.8rem;
      color: #4f46e5;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: center;
      margin-bottom: 4px;
    }
    .section-title {
      font-size: 1.1rem;
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }
    .section-badge {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* --- Footer --- */
    .preview-footer {
      text-align: center;
      padding: 32px 20px 48px;
      color: #aaa;
      font-size: 0.8rem;
    }
  </style>
</head>

  <!-- DiagnosticModule engine (inline, range + highest dual mode) -->
  <script>
    class DiagnosticModule {
      constructor(container, data, options) {
        options = options || {};
        this.container =
          typeof container === 'string'
            ? document.querySelector(container)
            : container;
        if (!this.container) {
          throw new Error('DiagnosticModule: コンテナが見つかりません - ' + container);
        }
        this.data = data;
        this.meta = data.meta;
        this.settings = Object.assign({}, DiagnosticModule.DEFAULT_SETTINGS, data.settings);
        this.questions = data.questions;
        this.results = data.results;
        this.options = options;
        this.currentIndex = 0;
        this.scores = {};
        this.totalScore = 0;
        this.answers = [];
        this._initScores();
        this._injectStyles();
      }

      static DEFAULT_SETTINGS = {
        choiceStyle: 'grid',
        showProgress: true,
        showQuestionNumber: true,
        animation: 'fade',
        resultShareEnabled: false,
        scoringMode: 'highest',
      };

      start() {
        this.currentIndex = 0;
        this.answers = [];
        this._initScores();
        this._renderStart();
      }

      reset() { this.start(); }

      getScores() {
        if (this.settings.scoringMode === 'range') {
          return { total: this.totalScore };
        }
        return Object.assign({}, this.scores);
      }

      onResult(callback) { this._onResultCallback = callback; }

      // --- Score logic ---

      _initScores() {
        if (this.settings.scoringMode === 'range') {
          this.totalScore = 0;
        } else {
          this.scores = {};
          var self = this;
          this.results.forEach(function(r) { self.scores[r.id] = 0; });
        }
      }

      _addScores(value) {
        if (this.settings.scoringMode === 'range') {
          this.totalScore += (typeof value === 'number' ? value : 0);
        } else {
          var self = this;
          if (value && typeof value === 'object') {
            Object.keys(value).forEach(function(key) {
              if (self.scores[key] !== undefined) {
                self.scores[key] += value[key];
              }
            });
          }
        }
      }

      _getTopResult() {
        if (this.settings.scoringMode === 'range') {
          return this._getRangeResult();
        }
        return this._getHighestResult();
      }

      _getHighestResult() {
        var maxScore = -Infinity;
        var topId = this.results[0].id;
        var self = this;
        Object.keys(this.scores).forEach(function(id) {
          if (self.scores[id] > maxScore) {
            maxScore = self.scores[id];
            topId = id;
          }
        });
        return this.results.find(function(r) { return r.id === topId; });
      }

      _getRangeResult() {
        var total = this.totalScore;
        for (var i = 0; i < this.results.length; i++) {
          var r = this.results[i];
          if (r.range && total >= r.range[0] && total <= r.range[1]) {
            return r;
          }
        }
        return this.results[this.results.length - 1];
      }

      // --- DOM helpers ---

      _el(tag, className, html) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        if (html !== undefined) el.innerHTML = html;
        return el;
      }

      _clear() { this.container.innerHTML = ''; }

      _animate(el) {
        var anim = this.settings.animation;
        if (anim === 'fade') {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.35s ease';
          requestAnimationFrame(function() { el.style.opacity = '1'; });
        } else if (anim === 'slide') {
          el.style.transform = 'translateX(30px)';
          el.style.opacity = '0';
          el.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
          requestAnimationFrame(function() {
            el.style.transform = 'translateX(0)';
            el.style.opacity = '1';
          });
        }
      }

      // --- Screens ---

      _renderStart() {
        this._clear();
        var wrap = this._el('div', 'dmod-wrap');
        var inner = this._el('div', 'dmod-start');
        inner.appendChild(this._el('h2', 'dmod-title', this.meta.title));
        inner.appendChild(this._el('p', 'dmod-desc', this.meta.description));
        var btn = this._el('button', 'dmod-btn dmod-btn--start', '診断をはじめる');
        var self = this;
        btn.addEventListener('click', function() { self._renderQuestion(); });
        inner.appendChild(btn);
        wrap.appendChild(inner);
        this.container.appendChild(wrap);
        this._animate(wrap);
      }

      _renderQuestion() {
        this._clear();
        var q = this.questions[this.currentIndex];
        var total = this.questions.length;
        var wrap = this._el('div', 'dmod-wrap');

        if (this.settings.showProgress) {
          var progressOuter = this._el('div', 'dmod-progress');
          var progressInner = this._el('div', 'dmod-progress__bar');
          progressInner.style.width = ((this.currentIndex) / total * 100) + '%';
          progressOuter.appendChild(progressInner);
          wrap.appendChild(progressOuter);
        }

        var qNum = this.settings.showQuestionNumber
          ? '<span class="dmod-qnum">Q' + (this.currentIndex + 1) + '/' + total + '</span> '
          : '';
        wrap.appendChild(this._el('p', 'dmod-question', qNum + q.text));

        if (q.image) {
          var qImg = this._el('img', 'dmod-question__image');
          qImg.src = q.image;
          qImg.alt = q.text;
          wrap.appendChild(qImg);
        }

        var choiceCount = q.choices.length;
        var styleClass =
          this.settings.choiceStyle === 'horizontal' || choiceCount === 2
            ? 'dmod-choices--horizontal'
            : 'dmod-choices--grid';
        var choicesWrap = this._el('div', 'dmod-choices ' + styleClass);
        var self = this;
        q.choices.forEach(function(choice) {
          var btn = self._el('button', 'dmod-choice', choice.text);
          btn.addEventListener('click', function() { self._handleAnswer(choice); });
          choicesWrap.appendChild(btn);
        });

        wrap.appendChild(choicesWrap);
        this.container.appendChild(wrap);
        this._animate(wrap);
      }

      _handleAnswer(choice) {
        this.answers.push({ questionId: this.questions[this.currentIndex].id, choiceId: choice.id });
        this._addScores(this.settings.scoringMode === 'range' ? choice.score : choice.scores);
        this.currentIndex++;
        if (this.currentIndex < this.questions.length) {
          this._renderQuestion();
        } else {
          this._renderResult();
        }
      }

      _renderResult() {
        this._clear();
        var result = this._getTopResult();

        if (this._onResultCallback) {
          this._onResultCallback(result, this.getScores(), this.answers);
        }

        if (result.url) {
          window.location.href = result.url;
          return;
        }

        var wrap = this._el('div', 'dmod-wrap');
        var inner = this._el('div', 'dmod-result');

        inner.appendChild(this._el('p', 'dmod-result__label', '診断結果'));
        inner.appendChild(this._el('h2', 'dmod-result__title', result.title));

        if (result.image) {
          var img = this._el('img', 'dmod-result__image');
          img.src = result.image;
          img.alt = result.title;
          inner.appendChild(img);
        }

        inner.appendChild(this._el('p', 'dmod-result__desc', result.description));

        if (result.tags && result.tags.length) {
          var tagsWrap = this._el('div', 'dmod-result__tags');
          result.tags.forEach(function(t) {
            var span = document.createElement('span');
            span.className = 'dmod-tag';
            span.textContent = '#' + t;
            tagsWrap.appendChild(span);
          });
          inner.appendChild(tagsWrap);
        }

        var self = this;
        var retryBtn = this._el('button', 'dmod-btn dmod-btn--retry', 'もう一度診断する');
        retryBtn.addEventListener('click', function() { self.reset(); });
        inner.appendChild(retryBtn);

        wrap.appendChild(inner);
        this.container.appendChild(wrap);
        this._animate(wrap);
      }

      _injectStyles() {
        if (document.getElementById('dmod-styles')) return;
        var style = document.createElement('style');
        style.id = 'dmod-styles';
        style.textContent = DiagnosticModule.CSS;
        document.head.appendChild(style);
      }

      static CSS = '\

';
    }
  </script>

  <!-- Initialization -->
  <script>
    // --- Tab switching ---
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // --- Demo 1: highest mode ---
    var diag1 = new DiagnosticModule('#diagnosis-personality', personalityData);
    diag1.start();

    // --- Demo 2: highest mode (yes/no) ---
    var diag2 = new DiagnosticModule('#diagnosis-yesno', yesnoData);
    diag2.start();

    // --- Demo 3: range mode ---
    var diag3 = new DiagnosticModule('#diagnosis-stress', stressData);
    diag3.start();
    diag3.onResult(function(result, scores) {
      console.log('[ストレス診断] 合計スコア:', scores.total, '→ 結果:', result.title);
    });
  </script>
